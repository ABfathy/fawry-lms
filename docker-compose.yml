services:
  db:
    image: postgres:17
    environment:
     POSTGRES_DB: ${DB_NAME:-fawry_lms}
     POSTGRES_USER: ${DB_USERNAME:-postgres}
     POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
    ports:
     - "127.0.0.1:5432:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
      
